name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.KITE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode is derived from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Require signing secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::KITE_KEYSTORE_* secrets are missing — refusing to publish unsigned APKs."
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing
        run: |
          # tr strips stray CR/whitespace a secret can pick up when set from Windows
          echo "${{ secrets.KITE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/kite-release.jks"
          {
            echo "KITE_KEYSTORE_FILE=$RUNNER_TEMP/kite-release.jks"
            echo "KITE_KEYSTORE_PASSWORD=${{ secrets.KITE_KEYSTORE_PASSWORD }}"
            echo "KITE_KEY_ALIAS=${{ secrets.KITE_KEY_ALIAS }}"
            echo "KITE_KEY_PASSWORD=${{ secrets.KITE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Assemble release APKs (gms + hms)
        run: ./gradlew assembleGmsRelease assembleHmsRelease
        env:
          KITE_SUPABASE_URL: ${{ secrets.KITE_SUPABASE_URL }}
          KITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Collect release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(git rev-list --count HEAD)"
          mkdir dist
          cp app-parent/build/outputs/apk/gms/release/app-parent-gms-release.apk "dist/kite-gms-$VERSION.apk"
          cp app-parent/build/outputs/apk/hms/release/app-parent-hms-release.apk "dist/kite-hms-$VERSION.apk"
          cp app-child/build/outputs/apk/gms/release/app-child-gms-release.apk "dist/kite-jr-gms-$VERSION.apk"
          cp app-child/build/outputs/apk/hms/release/app-child-hms-release.apk "dist/kite-jr-hms-$VERSION.apk"
          # Kill-switch / update manifest: the child app polls
          # releases/latest/download/update.json at least hourly.
          cat > dist/update.json <<EOF
          {
            "latestVersionCode": $CODE,
            "minSupportedVersionCode": 0,
            "disableEnforcement": false,
            "message": null
          }
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Kite $GITHUB_REF_NAME" \
            --generate-notes
