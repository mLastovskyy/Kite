name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.KITE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode is derived from `git rev-list --count HEAD`.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      # Signed with the shared release key from repo secrets, so every CI build installs
      # over the previous one without signature conflicts on the phone.
      - name: Prepare signing
        if: env.HAS_SIGNING == 'true'
        run: |
          # tr strips stray CR/whitespace a secret can pick up when set from Windows
          echo "${{ secrets.KITE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/kite-release.jks"
          {
            echo "KITE_KEYSTORE_FILE=$RUNNER_TEMP/kite-release.jks"
            echo "KITE_KEYSTORE_PASSWORD=${{ secrets.KITE_KEYSTORE_PASSWORD }}"
            echo "KITE_KEY_ALIAS=${{ secrets.KITE_KEY_ALIAS }}"
            echo "KITE_KEY_PASSWORD=${{ secrets.KITE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Assemble release APKs (gms + hms)
        run: ./gradlew assembleGmsRelease assembleHmsRelease
        env:
          KITE_SUPABASE_URL: ${{ secrets.KITE_SUPABASE_URL }}
          KITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Read version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^kite.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload Kite (parent) APKs
        uses: actions/upload-artifact@v4
        with:
          name: kite-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app-parent/build/outputs/apk/*/release/*.apk

      - name: Upload Kite Jr (child) APKs
        uses: actions/upload-artifact@v4
        with:
          name: kite-jr-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app-child/build/outputs/apk/*/release/*.apk
